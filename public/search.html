<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Catalog • OPAC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
            colors: {
              primary: "#1E3A8A",
              secondary: "#2563EB",
              lightblue: "#EFF6FF",
              hoverblue: "#3B82F6",
              textdark: "#1F2937"
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-lightblue font-sans text-textdark">
    <header class="border-b border-blue-100 bg-white">
      <div class="mx-auto container-max px-4 py-4 flex items-center justify-between gap-4">
        <a href="/" class="flex items-center gap-3">
          <img src="/image/logo-v2.png" alt="Saviour logo" class="h-10 w-10 rounded-xl object-cover" />
          <div>
            <div class="font-semibold leading-tight">Saviour School Library</div>
            <div class="text-xs text-slate-500">OPAC</div>
          </div>
        </a>
        <nav class="flex items-center gap-3 text-sm font-medium">
          <a
            class="px-3 py-2 rounded-xl text-primary font-semibold"
            href="/search.html"
            >Search Books</a
          >
          <a class="px-3 py-2 rounded-xl text-primary hover:text-hoverblue" href="/info.html"
            >Library Info</a
          >
          <a
            class="px-3 py-2 rounded-xl border border-blue-200 bg-white text-primary hover:bg-lightblue"
            href="/admin/login.html"
            >Admin Login</a
          >
        </nav>
      </div>
    </header>

    <main class="mx-auto container-max px-4 py-8">
      <section>
        <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-primary">
          Search the Library Catalog
        </h1>
        <p class="mt-2 text-sm text-slate-700">
          Search by title, author, subject, ISBN, category, or keyword.
        </p>

        <form
          id="searchForm"
          class="mt-5 grid gap-3 rounded-3xl border border-blue-100 bg-white p-4 md:p-5 shadow-sm md:grid-cols-4"
        >
          <div class="md:col-span-2">
            <label
              class="text-xs font-semibold uppercase tracking-wide text-slate-500"
              for="keyword"
              >Keyword</label
            >
            <input
              id="keyword"
              name="keyword"
              class="mt-1 w-full rounded-xl border border-blue-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-secondary/30"
              placeholder="Title, author, subject, ISBN, category..."
            />
          </div>
          <div>
            <label
              class="text-xs font-semibold uppercase tracking-wide text-slate-500"
              for="category"
              >Category</label
            >
            <input
              id="category"
              name="category"
              class="mt-1 w-full rounded-xl border border-blue-100 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-secondary/30"
              placeholder="e.g. Science"
            />
          </div>
          <div class="flex items-end gap-2">
            <button
              class="w-full rounded-2xl bg-secondary px-4 py-2.5 text-sm font-semibold text-white hover:bg-hoverblue transition"
              type="submit"
            >
              Search
            </button>
          </div>
        </form>
      </section>

      <section class="mt-8">
        <div class="flex items-center justify-between gap-3 text-sm">
          <div id="resultsSummary" class="text-slate-700">Search results will appear here.</div>
          <div class="flex items-center gap-2" id="paginationControls" hidden>
            <button
              id="prevPage"
              class="rounded-full border border-blue-100 bg-white px-3 py-1 text-xs text-primary disabled:opacity-50"
              type="button"
            >
              Prev
            </button>
            <span id="pageInfo" class="text-xs text-slate-600"></span>
            <button
              id="nextPage"
              class="rounded-full border border-blue-100 bg-white px-3 py-1 text-xs text-primary disabled:opacity-50"
              type="button"
            >
              Next
            </button>
          </div>
        </div>

        <div
          id="resultsGrid"
          class="mt-4 grid gap-4 sm:grid-cols-2 lg:grid-cols-3"
        ></div>
      </section>
    </main>

    <footer class="mt-8 bg-primary text-white">
      <div
        class="mx-auto container-max px-4 py-6 text-xs text-white/80 flex items-center justify-between gap-2"
      >
        <div>Library OPAC</div>
        <div>Search Catalog</div>
      </div>
    </footer>

    <script type="module" src="/js/search.js"></script>
  </body>
</html>
