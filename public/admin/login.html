<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Librarian Login • Library System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      tailwind.config = { theme: { extend: { fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] }, colors: { navy: "#0b1f3b" } } } };
    </script>
  </head>
  <body class="min-h-screen bg-slate-50 font-sans text-slate-900">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto container-max px-4 py-4 flex items-center justify-between gap-4">
        <a href="/" class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-xl bg-navy text-white grid place-items-center font-bold">L</div>
          <div>
            <div class="font-semibold leading-tight">Library System</div>
            <div class="text-xs text-slate-500">Librarian Area</div>
          </div>
        </a>
        <nav class="flex items-center gap-3 text-sm font-medium">
          <a class="px-3 py-2 rounded-xl hover:bg-slate-100" href="/search.html">OPAC Search</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto container-max px-4 py-10">
      <div class="mx-auto max-w-md rounded-3xl border border-slate-200 bg-white p-6 md:p-8 shadow-sm">
        <h1 class="text-2xl font-bold tracking-tight">Librarian login</h1>
        <p class="mt-2 text-sm text-slate-600">Use your librarian account to manage books, acquisitions, and borrowing.</p>

        <form id="loginForm" class="mt-6 space-y-4">
          <div>
            <label class="text-xs font-semibold uppercase tracking-wide text-slate-500">Username</label>
            <input name="username" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10" placeholder="admin" required />
          </div>
          <div>
            <label class="text-xs font-semibold uppercase tracking-wide text-slate-500">Password</label>
            <input name="password" type="password" class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-slate-900/10" placeholder="••••••••" required />
          </div>
          <button class="w-full rounded-2xl bg-slate-900 px-5 py-3 text-sm font-semibold text-white hover:bg-slate-800 transition" type="submit">
            Sign in
          </button>
        </form>

        <div class="mt-6 rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">
          <div class="font-semibold">Note: </div>
          <div class="mt-1 text-amber-800"><span class="font-mono"> Please contact the Administrator to get your username and password.</span></div>
        </div>
      </div>
    </main>

    <script type="module">
      import { apiFetch, toast } from "/js/utils.js";
      const form = document.getElementById("loginForm");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fd = new FormData(form);
        const payload = { username: fd.get("username"), password: fd.get("password") };
        try {
          await apiFetch("/api/admin/login", { method: "POST", body: JSON.stringify(payload) });
          window.location.href = "/admin/dashboard.html";
        } catch (err) {
          toast(err.message, "error");
        }
      });
    </script>
  </body>
</html>
