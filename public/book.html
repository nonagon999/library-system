<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Details • OPAC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
            colors: {
              primary: "#1E3A8A",
              secondary: "#2563EB",
              lightblue: "#EFF6FF",
              hoverblue: "#3B82F6",
              textdark: "#1F2937"
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-lightblue font-sans text-textdark">
    <header class="border-b border-blue-100 bg-white">
      <div class="mx-auto container-max px-4 py-4 flex items-center justify-between gap-4">
        <a href="/" class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-xl bg-primary text-white grid place-items-center font-bold">📚</div>
          <div>
            <div class="font-semibold leading-tight">Saviour School Library</div>
            <div class="text-xs text-slate-500">OPAC</div>
          </div>
        </a>
        <nav class="flex items-center gap-3 text-sm font-medium">
          <a class="px-3 py-2 rounded-xl text-primary hover:text-hoverblue" href="/search.html">Search Books</a>
          <a class="px-3 py-2 rounded-xl text-primary hover:text-hoverblue" href="/info.html">Library Info</a>
          <a class="px-3 py-2 rounded-xl border border-blue-200 bg-white text-primary hover:bg-lightblue" href="/admin/login.html">Admin Login</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto container-max px-4 py-8">
      <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-6">
        <div class="max-w-2xl">
          <a href="/search.html" class="text-sm font-semibold text-secondary hover:text-hoverblue">← Back to search</a>
          <h1 id="bookTitle" class="mt-3 text-2xl md:text-3xl font-bold tracking-tight">Book</h1>
          <div id="bookMeta" class="mt-2 text-sm text-slate-600">—</div>
          <div class="mt-4" id="availability"></div>
        </div>

        <div class="qrWrap rounded-2xl border border-blue-100 bg-white p-5 shadow-sm w-full md:w-[340px]">
          <div class="text-sm font-semibold">QR Code</div>
          <div class="mt-2 text-xs text-slate-500">Scan to open this book’s details page.</div>
          <div class="mt-4 rounded-xl border border-blue-100 bg-lightblue p-3 grid place-items-center">
            <img id="qrImg" class="h-56 w-56" alt="QR Code" />
          </div>
        </div>
      </div>

      <section class="mt-8">
        <h2 class="text-lg font-semibold text-primary">Book information</h2>
        <div id="details" class="mt-4 grid gap-3 md:grid-cols-3"></div>
      </section>
    </main>

    <footer class="mt-8 bg-primary text-white">
      <div class="mx-auto container-max px-4 py-6 text-xs text-white/80 flex items-center justify-between gap-2">
        <div>Library OPAC</div>
        <div>Book details</div>
      </div>
    </footer>

    <script type="module" src="/js/book.js"></script>
  </body>
</html>
