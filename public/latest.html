<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Latest Acquisitions • OPAC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/styles.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
            colors: {
              primary: "#1E3A8A",
              secondary: "#2563EB",
              lightblue: "#EFF6FF",
              hoverblue: "#3B82F6",
              textdark: "#1F2937"
            }
          }
        }
      };
    </script>
  </head>
  <body class="min-h-screen bg-lightblue font-sans text-textdark">
    <header class="border-b border-blue-100 bg-white">
      <div class="mx-auto container-max px-4 py-4 flex items-center justify-between gap-4">
        <a href="/" class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-xl bg-primary text-white grid place-items-center font-bold">
            📚
          </div>
          <div>
            <div class="font-semibold leading-tight">Saviour School Library</div>
            <div class="text-xs text-slate-500">OPAC</div>
          </div>
        </a>
        <nav class="flex items-center gap-3 text-sm font-medium">
          <a class="px-3 py-2 rounded-xl text-primary hover:text-hoverblue" href="/search.html"
            >Search Books</a
          >
          <a class="px-3 py-2 rounded-xl text-primary hover:text-hoverblue" href="/info.html"
            >Library Info</a
          >
          <a
            class="px-3 py-2 rounded-xl border border-blue-200 bg-white text-primary hover:bg-lightblue"
            href="/admin/login.html"
            >Admin Login</a
          >
        </nav>
      </div>
    </header>

    <main class="mx-auto container-max px-4 py-8">
      <section class="flex items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-primary">
            Latest Acquisitions
          </h1>
          <p class="mt-2 text-sm text-slate-700">
            Recently added books, sorted by date acquired.
          </p>
        </div>
      </section>

      <section class="mt-6">
        <div
          id="latestGrid"
          class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"
        ></div>
      </section>
    </main>

    <footer class="mt-8 bg-primary text-white">
      <div
        class="mx-auto container-max px-4 py-6 text-xs text-white/80 flex items-center justify-between gap-2"
      >
        <div>Library OPAC</div>
        <div>Latest Acquisitions</div>
      </div>
    </footer>

    <script type="module" src="/js/latest.js"></script>
  </body>
</html>
